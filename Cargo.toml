[package]
name = "wilderness"
version = "0.1.0"
edition = "2024"
description = "A first-person walk through a wild forest, on the Hydroxus engine."

# A workspace of its own: Cargo features add up across a workspace, and the engine picks OpenGL
# whenever anything enables it.
[workspace]

[dependencies]
# The engine's wgpu backend only. On Linux wgpu drives Vulkan.
fyrox = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "vulkan", default-features = false, features = ["backend_wgpu"] }
# Ray-traced shadows, which see through the gaps in leaves and needles; and other graphics
# improvements kept outside the engine.
# Reading which of a model's surfaces are double-sided, which the engine's glTF importer drops.
serde_json = "1"
# The wind's morph targets are stored as half floats.
half = "2"
# Encoding the snow's crystal maps, so the engine makes their mip levels as it loads them: the
# version the engine itself uses.
image = { version = "0.25", default-features = false, features = ["png"] }
fyrox-gfx = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "vulkan", features = ["raytracing"] }

# Optimized engine, debuggable game code. Without this a `cargo run` build is too slow to walk
# through a forest.
#
# The game's own code a little optimized too: unoptimized, laying out and planting the forest -
# some 2,000 trees and 85,000 plants - and swaying it every frame left it at 0-2 FPS, the forest
# never drawn in the first minute; at opt-level 1 it plays within seconds, 30 FPS rising to 60 as
# Yoctite finishes building, rebuilds as quickly after an edit, and still debugs.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
